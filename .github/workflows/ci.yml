name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Tests unitaires, format, compilation des binaires autonomes.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make vet
      - run: make test
      - run: make build
      - uses: actions/upload-artifact@v4
        with: { name: binaires, path: bin/ }

  # Test de bout en bout RÉEL (comptes, mots de passe, fichiers, Wi-Fi,
  # tâches planifiées, annulation) sur chaque distribution cible.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04                    # base de Zorin 17
          - ubuntu:24.04                    # base de Zorin 18
          - debian:12
          - linuxmintd/mint21.3-amd64
          - linuxmintd/mint22-amd64
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: binaires, path: bin }
      - run: chmod +x bin/*
      - run: apt-get update && apt-get install -y --no-install-recommends cron dbus dconf-cli passwd util-linux
      - run: tests/e2e/run.sh bin

  # Tests système réels (création de compte, apt, dconf d'un compte non
  # connecté) directement sur l'exécuteur.
  system:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-22.04, ubuntu-24.04] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: sudo apt-get update && sudo apt-get install -y dconf-cli dbus
      - run: sudo -E env "PATH=$PATH" BERNARD_SYSTEM_TESTS=1 go test -run Real -v ./internal/system ./internal/settings

  # Installation réelle d'une application Flathub (lent : exécution manuelle
  # ou hebdomadaire recommandée).
  flatpak:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: sudo -E env "PATH=$PATH" BERNARD_FLATPAK_TESTS=1 go test -run RealFlatpak -v -timeout 30m ./internal/system

  # Paquets Debian, construits sur chaque base pour la fenêtre (glibc).
  deb:
    needs: e2e
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: { os: [ubuntu-22.04, ubuntu-24.04] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config
      - run: packaging/deb/build.sh "0.0.0~ci${{ github.run_number }}"
      - run: sudo apt-get install -y ./dist/*.deb && bernard version
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: dist/*.deb
