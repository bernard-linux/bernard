name: Release

# Publie une version quand une étiquette « vX.Y.Z » est envoyée :
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Un seul paquet pour tous : construit sur la plus ancienne base prise en
  # charge (Ubuntu 22.04 : Zorin 17, Mint 21), dont la fenêtre dédiée
  # fonctionne aussi sur les bases plus récentes. Il est ensuite installé et
  # vérifié sur chaque base.
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.22" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config
      - name: Construire le paquet
        run: packaging/deb/build.sh "${GITHUB_REF_NAME#v}"
      - name: Vérifier la présence de la fenêtre
        run: dpkg-deb -c dist/bernard_*.deb | grep -q usr/bin/bernard-window
      - uses: actions/upload-artifact@v6
        with:
          name: deb
          path: dist/*.deb

  verify:
    needs: deb
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v7
        with: { name: deb, path: dist }
      - name: Installer et vérifier
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/bernard_*.deb
          bernard version
          ldd /usr/bin/bernard-window | grep -q "not found" && exit 1 || true

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with: { name: deb, path: dist }
      # Copie au nom fixe : le lien « releases/latest/download/bernard_amd64.deb »
      # désigne ainsi toujours la dernière version.
      - name: Nom fixe et empreintes
        run: cd dist && cp bernard_*_amd64.deb bernard_amd64.deb && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Créer la page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Seules les étiquettes « -rc », « -beta »… sont des préversions :
          # une préversion n'est jamais « latest », et le lien fixe
          # releases/latest/download/bernard_amd64.deb resterait sur
          # l'ancienne version.
          PRE="--latest"
          case "$GITHUB_REF_NAME" in *-*) PRE="--prerelease";; esac
          cat > notes.md <<'NOTES'
          ## Installer

          Sur les **deux** ordinateurs (ancien et nouveau), téléchargez `bernard_amd64.deb` ci-dessous, puis
          double-cliquez dessus, ou dans un terminal :

          ```sh
          cd /tmp
          wget https://github.com/bernard-linux/bernard/releases/latest/download/bernard_amd64.deb
          sudo apt install ./bernard_amd64.deb
          ```

          Un seul fichier pour Zorin OS 17 et 18, Linux Mint 21 et 22, Ubuntu 22.04 et 24.04, Debian 12.

          ## Utiliser

          Ouvrez **Bernard** depuis le menu des applications, sur les deux ordinateurs, dans l'ordre que vous voulez :

          - sur le nouvel ordinateur, choisissez « Ceci est le nouvel ordinateur » ;
          - sur l'ancien, « Ceci est l'ancien ordinateur ». Il attend le nouveau aussi longtemps qu'il le faut.

          Saisissez ensuite sur l'ancien le code affiché par le nouveau. Aucun terminal n'est nécessaire.

          Version de test : conservez l'ancien ordinateur intact tant que vous n'avez pas tout vérifié.
          Empreintes des fichiers : `SHA256SUMS`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "Bernard $GITHUB_REF_NAME" --notes-file notes.md $PRE
