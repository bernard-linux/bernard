name: Release

# Publie une version quand une étiquette « vX.Y.Z » est envoyée :
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Les paquets sont construits sur chaque base Ubuntu : la fenêtre dédiée
  # dépend de la version de glibc et de WebKitGTK de la distribution.
  deb:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            label: ubuntu22.04   # Zorin 17, Mint 21, Ubuntu 22.04
          - os: ubuntu-24.04
            label: ubuntu24.04   # Zorin 18, Mint 22, Ubuntu 24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev pkg-config
      - name: Construire les paquets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          packaging/deb/build.sh "$VERSION"
          cd dist
          # Nom distinct par base pour la fenêtre ; le paquet « bernard » est
          # identique partout (binaire autonome), on ne garde que celui de 24.04.
          for f in bernard-window_*.deb; do mv "$f" "${f%.deb}_${{ matrix.label }}.deb"; done
          if [ "${{ matrix.label }}" != ubuntu24.04 ]; then rm -f bernard_*.deb; fi
      - name: Vérifier l'installation
        run: sudo apt-get install -y ./dist/*.deb && bernard version
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.label }}
          path: dist/*.deb

  publish:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Empreintes
        run: cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS
      - name: Créer la page de téléchargement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) PRE="--prerelease";; esac
          cat > notes.md <<'NOTES'
          ## Installer

          Sur les **deux** ordinateurs, téléchargez `bernard_*_amd64.deb`, puis :

          ```sh
          sudo apt install ./bernard_*_amd64.deb
          ```

          Sur le **nouvel** ordinateur, ajoutez la fenêtre dédiée qui correspond à votre système :

          | Système | Fichier |
          | --- | --- |
          | Zorin OS 17, Linux Mint 21, Ubuntu 22.04 | `bernard-window_*_ubuntu22.04.deb` |
          | Zorin OS 18, Linux Mint 22, Ubuntu 24.04 | `bernard-window_*_ubuntu24.04.deb` |

          Sans elle, l'assistant s'ouvre dans le navigateur.

          ## Utiliser

          - Nouvel ordinateur : menu des applications → **Bernard**.
          - Ancien ordinateur : `sudo bernard-agent connect`, puis le code affiché.

          Version de test : conservez l'ancien ordinateur intact tant que vous n'avez pas tout vérifié.
          Empreintes des fichiers : `SHA256SUMS`.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --title "Bernard $GITHUB_REF_NAME" --notes-file notes.md $PRE
